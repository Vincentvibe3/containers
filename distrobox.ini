[development]
image=ghcr.io/vincentvibe3/toolbox-development:latest
home=~/distrobox-homes/development
init_hooks="/usr/share/container-setup/init.sh"
pull=true

[development-nvidia]
image=ghcr.io/vincentvibe3/toolbox-development:latest
home=~/distrobox-homes/development
init_hooks="/usr/share/container-setup/init.sh"
nvidia=true
pull=true

[cli-tools]
image=ghcr.io/vincentvibe3/toolbox-tools:latest
init_hooks="/usr/share/container-setup/init.sh"
pull=true

[latex]
image=ghcr.io/vincentvibe3/toolbox-latex:latest
init_hooks="/usr/share/container-setup/init.sh"
pull=true

[matlab]
image=ghcr.io/vincentvibe3/toolbox-matlab:latest
pull=true

[matlab-nvidia]
include=matlab
nvidia=true
pull=true
