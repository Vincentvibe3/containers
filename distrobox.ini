[development]
image=ghcr.io/vincentvibe3/dev-fedora-tbx:latest
home=~/distrobox-homes/development
init_hooks="/usr/share/container-setup/init.sh"
pull=true

[cli-tools]
image=ghcr.io/vincentvibe3/tools-fedora-tbx:latest
init_hooks="/usr/share/container-setup/init.sh"
pull=true

[latex]
image=ghcr.io/vincentvibe3/latex-fedora-tbx:latest
init_hooks="/usr/share/container-setup/init.sh"
pull=true

[ubuntu-embedded-sdks]
image=ghcr.io/vincentvibe3/embedded-sdks-ubuntu-tbx:latest
init_hooks="/usr/share/container-setup/init.sh"
pull=true

[matlab]
image=ghcr.io/vincentvibe3/matlab-tbx:latest
pull=true

[development-nvidia]
include=development
nvidia=true

[ubuntu-embedded-sdks-nvidia]
include=ubuntu-embedded-sdks
nvidia=true

[matlab-nvidia]
include=matlab
nvidia=true

