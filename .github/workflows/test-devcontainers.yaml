name: "CI - Test Features"
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - dev-graphical

        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4

      - run: sudo mkdir -p /run/user/1000
        if: ${{ matrix.features == 'dev-graphical' }}
      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} --project-folder ./devcontainers/features

  test-scenarios:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - dev-graphical
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated --project-folder ./devcontainers/features

  test-global:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only --project-folder ./devcontainers/features

  aggregate-fail:
    runs-on: ubuntu-latest
    if: ${{ needs.test-autogenerated.result != 'success' && needs.test-global.result != 'success' && needs.test-scenarios.result != 'success'  }}
    needs: [test-global, test-scenarios, test-autogenerated]
    steps:
      - run: echo "Tests have failed" && exit 1
